<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variables</title>
</head>
<body>
    <h1>Javascript operators</h1>
    <p></p>
    <script>
        let x = 7
        let y = 3
        let z = x * y
        document.write("The product is; ", z)
    </script>

    <h2>The ++ operator</h2>
    <p id="Increment"></p>
    <script>
        let a = 9;
        a++;
        let b = a;
        document.getElementById("Increment").innerHTML = "The increment is; "+ b;
    </script>

    <h3>The -- operator</h3>
    <p id="Decrement"></p>
    <script>
        let c = 83;
        c--;
        let d = c;
        document.getElementById("Decrement").innerHTML = "The decrement is; " + d;
        document.write("<br>")
        document.write("Modulus")
        let e = 21
        let f = 4
        let g = e % f
        document.write("<br>")
        document.write("<br>")
        document.write("The modulus is; ", g)

    </script>


</body>
</html>
