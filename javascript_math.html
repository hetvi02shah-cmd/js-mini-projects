<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Math.PI</h1>
    <script>
        let r = 9
        let Area = Math.PI * (r ** 2)
        document.write("Calculate the area of a circle with a radius of 9; Area = πr**2: ", "<br>", "<br>")
        document.write(Area)
</script>

<h2>Math.round</h2>
<script>
    let x = 3.78
    let round = Math.round(x)
    document.write("Round 3.78 to the nearest whole number; ", "<br>")
    document.write(round)

</script>

<h3>Math.ceil</h3>
<script>
    let y = 6.4
    let ceil = Math.ceil(y)
    document.write(ceil)
</script>

<h4>Math.floor</h4>
<script>
    let z = 8.9
    let floor = Math.floor(z)
    document.write(floor)
</script>

<h5>Math.sqrt</h5>
<script>
    let b = 81
    let sqrt = Math.sqrt(b)
    document.write("Calculate the square root of 81: ", "<br>")
    document.write(sqrt)
</script>

    
</body>
</html>
